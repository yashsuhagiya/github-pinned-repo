<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Get any GitHub user's pinned repositories as JSON or an SVG card.">
  <title>GitHub Pinned Repositories API</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --surface: #f6f8fa;
      --accent: #0969da;
      --danger: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --surface: #151b23;
        --accent: #4493f8;
        --danger: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    h2 { font-size: 1rem; margin: 0 0 8px; color: var(--muted); }
    p { margin: 0 0 12px; }
    a { color: var(--accent); }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875rem;
    }
    .muted { color: var(--muted); }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 24px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.875rem; font-weight: 600; }
    input, select, button {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
    }
    select:disabled { opacity: 0.5; }
    button { cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .submit { align-self: end; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .row code {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      white-space: nowrap;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .row button { padding: 4px 10px; font-size: 0.875rem; }
    #status.err { color: var(--danger); }
    pre {
      margin: 0 0 12px;
      padding: 12px;
      max-height: 480px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      white-space: pre-wrap;
      word-break: break-word;
    }
    #preview img { max-width: 100%; height: auto; display: block; margin-bottom: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>GitHub Pinned Repositories API</h1>
    <p>Fetch any GitHub user's pinned repositories as JSON, render them as an embeddable SVG card, or list their public repositories. No API key required.</p>
    <p class="muted"><a href="/openapi.yaml">OpenAPI spec</a> &middot; <a href="https://github.com/yashsuhagiya/github-pinned-repo">Source on GitHub</a></p>

    <form id="form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" value="yashsuhagiya" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="endpoint">Endpoint</label>
        <select id="endpoint" name="endpoint">
          <option value="pinned">Pinned JSON: /{username}</option>
          <option value="svg">SVG card: /{username}.svg</option>
          <option value="repos">Repositories: /{username}/repos</option>
        </select>
      </div>
      <div class="field">
        <label for="theme">Theme (SVG only)</label>
        <select id="theme" name="theme" disabled>
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
      </div>
      <div class="field submit">
        <button type="submit" class="primary">Send request</button>
      </div>
    </form>

    <section id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">Request</h2>
      <div class="row">
        <code id="url" aria-label="Request URL"></code>
        <button type="button" data-copy="url">Copy</button>
      </div>
      <p id="status" aria-live="polite"></p>
      <div id="preview" hidden></div>
      <div id="snippet-wrap" hidden>
        <h2>Markdown embed</h2>
        <div class="row">
          <code id="snippet" aria-label="Markdown embed"></code>
          <button type="button" data-copy="snippet">Copy</button>
        </div>
      </div>
      <pre id="output" hidden></pre>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById("form");
      var usernameEl = document.getElementById("username");
      var endpointEl = document.getElementById("endpoint");
      var themeEl = document.getElementById("theme");
      var resultEl = document.getElementById("result");
      var urlEl = document.getElementById("url");
      var statusEl = document.getElementById("status");
      var previewEl = document.getElementById("preview");
      var snippetWrap = document.getElementById("snippet-wrap");
      var snippetEl = document.getElementById("snippet");
      var outputEl = document.getElementById("output");
      var seq = 0;

      endpointEl.addEventListener("change", function () {
        themeEl.disabled = endpointEl.value !== "svg";
      });

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = isError ? "err" : "";
      }

      function showOutput(text) {
        outputEl.textContent = text;
        outputEl.hidden = false;
      }

      function describeError(res, body, ms) {
        var msg = "";
        try { msg = JSON.parse(body).error || ""; } catch (e) { /* not JSON */ }
        setStatus("HTTP " + res.status + " · " + ms + " ms" + (msg ? " · " + msg : ""), true);
        showOutput(msg || body);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var id = ++seq;
        var username = usernameEl.value.trim();
        var endpoint = endpointEl.value;
        var theme = themeEl.value;

        previewEl.hidden = true;
        previewEl.textContent = "";
        snippetWrap.hidden = true;
        outputEl.hidden = true;
        outputEl.textContent = "";

        if (!username) {
          resultEl.hidden = false;
          urlEl.textContent = "";
          setStatus("Enter a GitHub username.", true);
          usernameEl.focus();
          return;
        }

        var path = "/" + encodeURIComponent(username);
        if (endpoint === "svg") path += ".svg?theme=" + encodeURIComponent(theme);
        else if (endpoint === "repos") path += "/repos";
        var url = location.origin + path;

        resultEl.hidden = false;
        urlEl.textContent = url;
        setStatus("Loading…", false);

        var start = performance.now();

        if (endpoint === "svg") {
          var img = document.createElement("img");
          img.alt = "Pinned repositories of " + username;
          img.addEventListener("load", function () {
            if (id !== seq) return;
            setStatus("HTTP 200 · " + Math.round(performance.now() - start) + " ms", false);
          });
          img.addEventListener("error", function () {
            if (id !== seq) return;
            previewEl.hidden = true;
            snippetWrap.hidden = true;
            fetch(url).then(function (res) {
              return res.text().then(function (body) {
                if (id === seq) describeError(res, body, Math.round(performance.now() - start));
              });
            }).catch(function (err) {
              if (id === seq) setStatus("Request failed: " + err.message, true);
            });
          });
          img.src = url;
          previewEl.appendChild(img);
          previewEl.hidden = false;
          snippetEl.textContent = "![Pinned repositories](" + url + ")";
          snippetWrap.hidden = false;
          return;
        }

        fetch(url).then(function (res) {
          return res.text().then(function (body) {
            if (id !== seq) return;
            var ms = Math.round(performance.now() - start);
            if (!res.ok) {
              describeError(res, body, ms);
              return;
            }
            setStatus("HTTP " + res.status + " · " + ms + " ms", false);
            var text = body;
            try { text = JSON.stringify(JSON.parse(body), null, 2); } catch (e) { /* show raw */ }
            showOutput(text);
          });
        }).catch(function (err) {
          if (id === seq) setStatus("Request failed: " + err.message, true);
        });
      });

      document.addEventListener("click", function (event) {
        var btn = event.target.closest("button[data-copy]");
        if (!btn) return;
        var text = document.getElementById(btn.getAttribute("data-copy")).textContent;
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = "Copied";
        }, function () {
          btn.textContent = "Failed";
        });
        setTimeout(function () { btn.textContent = "Copy"; }, 1500);
      });
    })();
  </script>
</body>
</html>
